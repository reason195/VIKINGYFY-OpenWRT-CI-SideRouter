# 网络与 TCP 调优。文件名必须以 zz- 开头：/etc/init.d/sysctl 按字典序应用
# /etc/sysctl.d/*.conf（字母 > 数字），qca-nss-ecm.conf（nf_conntrack_max=65535）
# 排在 99- 之后会覆盖本文件——曾导致烤入的 131072 实际不生效（运行时 65535）。
net.netfilter.nf_conntrack_max=131072
# TCP 缓冲区上限 4MB：代理两段 TCP 均终结于路由器，单流吞吐上限 ≈ 缓冲/RTT，
# 1MB 上限在 50ms RTT 下仅 ~160Mbps，高带宽宽带跑不满。
net.ipv4.tcp_rmem=4096 524288 4194304
net.ipv4.tcp_wmem=4096 524288 4194304
net.core.rmem_max=4194304
net.core.wmem_max=4194304
# 旁路由转发总开关：本机作为客户端的网关，进出都走 br-lan，不显式写死就依赖 base-files 默认值。
net.ipv4.ip_forward=1
net.ipv6.conf.all.forwarding=1
# rp_filter 是旁路由最常见的「看着一切正常实际不通」根因：客户端流量从 br-lan 进来、又从同一个
# br-lan 出去，且主路由可能把回程直接发给客户端（非对称路径）。严格模式(=1)会按反向路径
# 校验丢包，故显式关闭。all 与 default 都要写：default 会拷给之后新出现的接口。
net.ipv4.conf.all.rp_filter=0
net.ipv4.conf.default.rp_filter=0
# BBR：依赖 kmod-tcp-bbr（Config/GENERAL.txt 已加）。旧固件无该模块时本行应用失败，
# 固定放最后一行，不影响上方参数。
net.ipv4.tcp_congestion_control=bbr

name: Auto-Clean

on:
  #自动清理：每天早上5点
  schedule:
    - cron: 0 21 * * *
  #手动清理
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Skip cleanup while build in progress
        id: guard
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          # QCA-ALL 编译（cron 17 16，含调度延迟常持续数小时）与 Auto-Clean（cron 0 21）存在竞争窗口：
          # 清理恰逢构建发布 release / 生成变更日志（读 PREV_TAG）时，会读到漂移的 PREV_TAG
          # （变更范围错误），甚至误删刚发布的版本。检测到构建进行中则本轮跳过清理。
          RUNS=$(gh run list -R "$GITHUB_REPOSITORY" --workflow=QCA-ALL.yml --status=in_progress --limit 1 --json databaseId -q '.[].databaseId' 2>/dev/null || true)
          if [ -n "$RUNS" ]; then
            echo "::warning::QCA-ALL 构建进行中（run=${RUNS}），跳过本轮清理"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "无进行中的 QCA-ALL 构建，继续清理"
      - name: Delete old Releases and Workflows
        if: steps.guard.outputs.skip != 'true'
        uses: ophub/delete-releases-workflows@f5873e66feb0a85460d7fbc073de6c89470e94d3 # main (2026-10-03)
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 5
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
